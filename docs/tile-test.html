<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tile Render Test — THE ABYSS</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: monospace; margin: 20px; font-size: 13px; }
    h1 { font-size: 15px; color: #f0f6fc; margin-bottom: 4px; }
    h2 { font-size: 13px; color: #8b949e; margin: 16px 0 6px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
    .ok    { color: #3fb950; }
    .fail  { color: #f85149; }
    .warn  { color: #d29922; }
    .info  { color: #58a6ff; }
    .dim   { color: #8b949e; }
    canvas { border: 1px solid #30363d; margin: 6px 0; display: block; }
    #results { margin-top: 16px; max-width: 900px; }
    .result-line { margin: 1px 0; font-size: 12px; }
    .section { margin: 12px 0; padding: 10px; background: #161b22; border-radius: 6px; border: 1px solid #21262d; }
    #summary { position: sticky; top: 0; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 14px; z-index: 10; margin-bottom: 16px; font-size: 12px; }
    .bold { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Tile Render Diagnostic — THE ABYSS</h1>
  <div id="summary">Initializing...</div>
  <div id="results"></div>

  <script src="p5.js"></script>
  <script>
    // ============================================================
    // Serve from repo root:  npx serve .
    // Open: http://127.0.0.1:5500/docs/tile-test.html
    // If your server uses port 3000, change BASE to:
    //   const BASE = 'http://127.0.0.1:3000';
    // ============================================================
    const BASE = 'http://127.0.0.1:5500';

    const TILE_W       = 16;
    const TILE_DISPLAY = 80;

    const TILESETS = [
      { firstgid: 1,    source: "../tilesets/prototype-tileset/prototype-tileset.tsx",  name: "prototype" },
      { firstgid: 111,  source: "../tilesets/Atlantis/atlantis-tileset-1.tsx",       name: "atlantis-1" },
      { firstgid: 687,  source: "../tilesets/Atlantis/atlantis-tileset-2.tsx",       name: "atlantis-2" },
      { firstgid: 1263, source: "../tilesets/Atlantis/atlantis-tileset-3.tsx",       name: "atlantis-3" },
    ];

    const TEST_GIDS = [23, 508];

    const metaCache  = {};
    const atlasCache = {};
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');

    // ---- Logging ----
    function log(msg, type) {
      type = type || "info";
      const tag = "[" + new Date().toISOString().split('T')[1].slice(0,9) + "] " + msg;
      console.log(tag);
      const el = document.createElement("div");
      el.className = "result-line " + type;
      el.textContent = msg;
      resultsEl.appendChild(el);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function sec(title) {
      const s = document.createElement("div");
      s.className = "section";
      const h = document.createElement("h2");
      h.textContent = title;
      s.appendChild(h);
      resultsEl.appendChild(s);
      return s;
    }

    function setSummary(html) { summaryEl.innerHTML = html; }

    // ---- Core utils ----
    function normalizeRelativePath(basePath, relativePath) {
      var baseParts = String(basePath).split("/").filter(Boolean);
      var relParts  = String(relativePath || "").split("/").filter(Boolean);
      for (var i = 0; i < relParts.length; i++) {
        var part = relParts[i];
        if (part === ".") continue;
        if (part === "..") { baseParts.pop(); continue; }
        baseParts.push(part);
      }
      return baseParts.join("/");
    }

    function getPathDir(path) {
      var parts = String(path || "").split("/").filter(Boolean);
      parts.pop();
      return parts.join("/");
    }

    function fallbackPath(source, mapDir) {
      mapDir = mapDir || "data/rooms";
      if (!source) return null;
      if (String(source).toLowerCase().endsWith("backgrounds.tsx")) return null;
      var resolved = normalizeRelativePath(mapDir, source);
      var dir      = getPathDir(resolved);
      var fname    = resolved.split("/").pop().replace(/\.tsx$/i, ".png");
      return normalizeRelativePath(dir, fname);
    }

    function parseTsxMetadata(xmlText, sourcePath) {
      sourcePath = sourcePath || "";
      var empty = { tilePropertiesById: {}, tileImagesById: {}, resolvedImagePath: null, tilewidth: null, tileheight: null, columns: null, tilecount: null };
      if (!xmlText || typeof DOMParser === "undefined") return empty;
      var parser = new DOMParser();
      var doc    = parser.parseFromString(xmlText, "application/xml");
      var tsNode = doc.querySelector("tileset");
      if (!tsNode) return empty;
      var baseDir = getPathDir(sourcePath);
      var tilePropertiesById = {};
      var tileImagesById     = {};
      var rootChildren = Array.from(tsNode.children || []);
      var rootImageNode = rootChildren.find(function(n) { return String(n && n.tagName).toLowerCase() === "image"; });
      var rootImageSource = rootImageNode ? rootImageNode.getAttribute("source") : null;
      var resolvedImagePath = rootImageSource ? normalizeRelativePath(baseDir, rootImageSource) : null;
      var tileNodes = Array.from(tsNode.querySelectorAll("tile"));
      for (var i = 0; i < tileNodes.length; i++) {
        var tileNode = tileNodes[i];
        var localId = Number(tileNode.getAttribute("id"));
        if (!Number.isFinite(localId)) continue;
        var props = {};
        var propNodes = Array.from(tileNode.querySelectorAll("properties > property"));
        for (var j = 0; j < propNodes.length; j++) {
          var p = propNodes[j];
          var n = p.getAttribute("name");
          if (n) props[n] = p.getAttribute("value") || p.textContent || "";
        }
        if (Object.keys(props).length) tilePropertiesById[localId] = props;
        var tileChildren = Array.from(tileNode.children || []);
        var tileImgNode = tileChildren.find(function(n) { return String(n && n.tagName).toLowerCase() === "image"; });
        var tileImgSrc  = tileImgNode ? tileImgNode.getAttribute("source") : null;
        if (!tileImgSrc) continue;
        tileImagesById[localId] = { source: tileImgSrc, resolvedImagePath: normalizeRelativePath(baseDir, tileImgSrc) };
      }
      return {
        tilePropertiesById: tilePropertiesById, tileImagesById: tileImagesById, resolvedImagePath: resolvedImagePath,
        tilewidth:  Number(tsNode.getAttribute("tilewidth")  || 0) || null,
        tileheight: Number(tsNode.getAttribute("tileheight") || 0) || null,
        columns:    Number(tsNode.getAttribute("columns")    || 0) || null,
        tilecount:  Number(tsNode.getAttribute("tilecount")  || 0) || null,
      };
    }

    function getTilesetForGid(gid) {
      var best = null;
      for (var i = 0; i < TILESETS.length; i++) {
        var ts = TILESETS[i];
        var fg = Number(ts && ts.firstgid || 0);
        if (!fg || gid < fg) continue;
        if (!best || fg > best.firstgid) best = Object.assign({}, ts, { firstgid: fg });
      }
      return best;
    }

    // ---- HTTP with timeout ----
    function fetchWithTimeout(url, options, timeout) {
      options = options || {};
      timeout = timeout || 5000;
      return new Promise(function(resolve, reject) {
        var controller = new AbortController();
        var id = setTimeout(function() { controller.abort(); }, timeout);
        fetch(url, Object.assign({}, options, { signal: controller.signal }))
          .then(function(resp) { clearTimeout(id); resolve(resp); })
          .catch(function(err) { clearTimeout(id); reject(err); });
      });
    }

    function getText(url) {
      return new Promise(function(resolve) {
        log("[fetch] GET " + url, "dim");
        fetchWithTimeout(url, {}, 8000)
          .then(function(r) {
            log("[fetch] HTTP " + r.status + " " + url, r.ok ? "dim" : "fail");
            if (!r.ok) { resolve(null); return; }
            if (r.status === 204) { resolve(""); return; }
            r.text().then(resolve).catch(function() { resolve(null); });
          })
          .catch(function(err) {
            log("[fetch] ERROR " + url + " -> " + err.name + ": " + err.message, "fail");
            resolve(null);
          });
      });
    }

    // ---- p5.js loadImage (returns Promise) ----
    function loadImageP(url) {
      return new Promise(function(resolve) {
        log("[p5.loadImage] START " + url, "dim");
        if (typeof loadImage === "undefined") {
          log("[p5.loadImage] FAIL: loadImage global not found!", "fail");
          resolve(null);
          return;
        }
        loadImage(url,
          function(img) {
            log("[p5.loadImage] SUCCESS " + url + " -> " + img.width + "x" + img.height, "ok");
            resolve(img);
          },
          function(err) {
            log("[p5.loadImage] FAIL " + url + " -> " + err, "fail");
            resolve(null);
          }
        );
      });
    }

    // ---- p5.js sketch ----
    var finished = false;

    function setup() {
      log("=== SETUP CALLED ===", "info");
      log("BASE = " + BASE, "dim");
      log("p5.js: " + (typeof window.p5 !== "undefined" ? "loaded" : "MISSING (check p5.js loads)"), window.p5 ? "ok" : "fail");
      log("loadImage: " + (typeof loadImage !== "undefined" ? "ready" : "MISSING"), "dim");
      createCanvas(820, 250);
      pixelDensity(1);
      textSize(11);
      setSummary("Running... open browser console (F12) for step-by-step progress");
      loadAll().then(function() {
        finished = true;
        log("=== ALL DONE ===", "ok");
      }).catch(function(err) {
        log("=== CRASH: " + err + " ===", "fail");
        finished = true;
      });
    }

    function draw() {
      if (!finished) {
        background(30);
        fill(200);
        textAlign(CENTER, CENTER);
        text("Loading tilesets...", width / 2, height / 2);
        textAlign(LEFT);
      }
    }

    // ---- Main async sequence ----
    function loadAll() {
      return new Promise(function(resolveAll) {

        log("");
        log("=== loadAll() STARTED ===", "info");

        // Step 1: TSX parse
        log("");
        log("--- STEP 1: Fetching + parsing TSX files ---", "info");
        var step1done = 0;
        TILESETS.forEach(function(ts) {
          var mapDir   = "data/rooms";
          var resolved = normalizeRelativePath(mapDir, ts.source);
          ts._resolved = resolved;
          getText(BASE + "/" + resolved).then(function(xml) {
            if (!xml) {
              log("  FAIL: TSX not found at " + resolved, "fail");
              metaCache[resolved] = null;
            } else {
              var meta = parseTsxMetadata(xml, resolved);
              metaCache[resolved] = meta;
              ts._meta = meta;
              ts._fromTsx      = meta.resolvedImagePath;
              ts._fromFallback = fallbackPath(ts.source, mapDir);
              var same = ts._fromTsx === ts._fromFallback;
              log("  OK: " + ts.name + " tiles=" + meta.tilecount + " " + meta.tilewidth + "x" + meta.tileheight + "px cols=" + meta.columns, "ok");
              var tsxMsg = "  tsx <image>: \"" + (ts._fromTsx || "NONE") + "\"";
              if (same) tsxMsg += "  [SAME as fallback -- may indicate path issue]";
              log(tsxMsg, same ? "warn" : (ts._fromTsx ? "fail" : "warn"));
              log("  fallback:  \"" + ts._fromFallback + "\"", "dim");
            }
            step1done++;
            if (step1done === TILESETS.length) doStep2();
          });
        });

        function doStep2() {
          log("");
          log("--- STEP 2: HTTP HEAD existence checks ---", "info");
          var step2done = 0;
          TILESETS.forEach(function(ts) {
            var meta = metaCache[ts._resolved];
            if (!meta) { step2done++; if (step2done === TILESETS.length) doStep3(); return; }
            var fromTsx      = ts._fromTsx;
            var fromFallback  = ts._fromFallback;
            var paths = [];
            if (fromTsx && fromFallback) paths = fromTsx === fromFallback ? [fromTsx] : [fromTsx, fromFallback];
            else if (fromFallback) paths = [fromFallback];
            else paths = [];
            // deduplicate
            var seen = {}; paths = paths.filter(function(p) { if (seen[p]) return false; seen[p] = true; return true; });

            var tried = 0;
            if (paths.length === 0) {
              log("  SKIP: no path for " + ts.name, "warn");
              ts._atlasExists = false;
              step2done++; if (step2done === TILESETS.length) doStep3();
              return;
            }

            var ok = false;
            paths.forEach(function(p) {
              var url = BASE + "/" + p;
              fetchWithTimeout(url, { method: "HEAD" }, 3000)
                .then(function(r) {
                  if (r.ok) { log("  OK: " + p + " -> HTTP " + r.status + " EXISTS", "ok"); ok = true; }
                  else log("  FAIL: " + p + " -> HTTP " + r.status, "fail");
                  tried++;
                  if (tried === paths.length && !ok) log("  FAIL: All paths 404 for " + ts.name, "fail");
                  ts._atlasExists = ok;
                  step2done++; if (step2done === TILESETS.length) doStep3();
                })
                .catch(function(err) {
                  log("  ERROR: " + p + " -> " + err.name, "fail");
                  tried++;
                  if (tried === paths.length && !ok) log("  FAIL: All paths exhausted for " + ts.name, "fail");
                  ts._atlasExists = false;
                  step2done++; if (step2done === TILESETS.length) doStep3();
                });
            });
          });
        }

        function doStep3() {
          log("");
          log("--- STEP 3: p5.js loadImage (actual atlas pixels) ---", "info");
          var step3done = 0;
          TILESETS.forEach(function(ts) {
            var meta = metaCache[ts._resolved];
            if (!meta) { step3done++; if (step3done === TILESETS.length) doStep4(); return; }
            var path = ts._fromTsx || ts._fromFallback;
            if (!path) {
              log("  SKIP: no path for " + ts.name, "warn");
              ts._atlasLoaded = false;
              step3done++; if (step3done === TILESETS.length) doStep4(); return;
            }
            log("  Loading " + ts.name + " from: " + BASE + "/" + path, "info");
            loadImageP(BASE + "/" + path).then(function(img) {
              if (img && img.width > 0) {
                atlasCache[ts._resolved] = { img: img, w: img.width, h: img.height, loaded: true };
                ts._atlasLoaded = true;
                ts._atlasW = img.width;
                ts._atlasH = img.height;
                log("  OK: " + ts.name + " loaded " + img
                .width + "x" + img.height, "ok");
              } else {
                atlasCache[ts._resolved] = { img: null, w: 0, h: 0, loaded: false };
                ts._atlasLoaded = false;
                log("  FAIL: " + ts.name + " img=" + (img ? "width=0" : "null") + " (likely 404 -> p5 placeholder)", "fail");
              }
              step3done++; if (step3done === TILESETS.length) doStep4();
            });
          });
        }

        function doStep4() {
          log("");
          log("--- STEP 4: Tile render preview ---", "info");
          background(30);
          fill(180);
          text("GID -> tileset -> localId -> src(x,y) -> fits?   [green=OK  red=MISSING/OUT_OF_BOUNDS]", 10, 16);

          var x = 10, y = 34, col = 0;
          var PER_ROW = 6;
          for (var gi = 0; gi < TEST_GIDS.length; gi++) {
            var gid = TEST_GIDS[gi];
            var ts    = getTilesetForGid(gid);
            var meta  = ts ? metaCache[ts._resolved] : null;
            var atlas = ts ? (atlasCache[ts._resolved] || {}) : {};
            var localId = ts ? gid - ts.firstgid : -1;
            var tW  = meta && meta.tilewidth  || 16;
            var tH  = meta && meta.tileheight || 16;
            var cols = meta && meta.columns ? meta.columns : Math.max(1, Math.floor((atlas.w || 16) / tW));
            var srcX = (localId % cols) * tW;
            var srcY = Math.floor(localId / cols) * tH;
            var fits = atlas.w > 0 && srcX + tW <= atlas.w && srcY + tH <= atlas.h;
            var ok   = atlas.loaded && fits;

            fill(ok ? color(0, 50, 30) : color(50, 0, 0));
            noStroke();
            rect(x, y, TILE_DISPLAY, TILE_DISPLAY);
            if (atlas.img && ok) image(atlas.img, x, y, TILE_DISPLAY, TILE_DISPLAY, srcX, srcY, tW, tH);

            noFill();
            stroke(ok ? color(0, 220, 100) : color(255, 60, 60));
            strokeWeight(2);
            rect(x, y, TILE_DISPLAY, TILE_DISPLAY);
            noStroke();

            fill(ok ? color(0, 220, 100) : color(255, 60, 60));
            textAlign(CENTER);
            text("GID=" + gid, x + TILE_DISPLAY/2, y + TILE_DISPLAY + 12);
            fill(150);
            text((ts ? ts.name : "?") + " id=" + localId, x + TILE_DISPLAY/2, y + TILE_DISPLAY + 24);
            textAlign(LEFT);

            col++;
            if (col % PER_ROW === 0) { x = 10; y += TILE_DISPLAY + 38; }
            else x += TILE_DISPLAY + 10;
          }

          var loadedCount = 0;
          for (var ti = 0; ti < TILESETS.length; ti++) if (TILESETS[ti]._atlasLoaded) loadedCount++;
          setSummary(
            "<span class=\"bold\">Result: " + loadedCount + "/" + TILESETS.length + " atlases loaded</span>  |  " +
            "BASE=" + BASE + "  |  " +
            "Green tiles=OK  Red=MISSING/OUT_OF_BOUNDS  |  " +
            "If all red: check BASE URL and server CORS policy"
          );

          log("");
          log("=== DIAGNOSTIC COMPLETE ===", "ok");
          log("Check the Step 4 preview above. Red tiles = atlas missing or tile out of bounds.", "info");
          log("If steps 1-3 show all OK but tiles still red: tile coords are wrong for this GID.", "info");
          resolveAll();
        }

      }); // end loadAll() Promise
    }
  </script>
</body>
</html>
